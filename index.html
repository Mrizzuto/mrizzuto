<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>/Max Rizzuto/</title>
<style>
html,body{margin:0;background:#fff;color:#000}
body{font:16px 'Times New Roman',Times,serif}
a{color:#0000EE}
a.v{color:#551A8B}
hr{margin:4px 0;border:0;border-top:1px solid #8a8a8a;border-bottom:1px solid #eee}
img.i{width:20px;height:22px;image-rendering:pixelated;display:block}
h1{margin:21px 0;font:bold 32px 'Times New Roman',Times,serif}
address{font-style:italic}
pre{margin:0;font:14px/1.5 'Courier New',Courier,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
p{text-wrap:pretty}
#list{padding:8px 8px 24px;max-width:900px;box-sizing:border-box}
.row{display:grid;grid-template-columns:20px minmax(200px,360px) 100px 48px minmax(160px,280px);column-gap:10px;align-items:start;min-height:24px;line-height:24px}
.row .n{overflow-wrap:anywhere}
.row .s{text-align:right}
.grp{display:flex;align-items:baseline;gap:10px;padding:14px 0 4px 30px;border-bottom:1px solid #ddd;margin-bottom:2px}
.grp span,.mgrp span{font-size:14px;color:#555}
.win{position:fixed;background:#fff;border:1px solid #8a8a8a;box-shadow:3px 3px 0 #8a8a8a;display:flex;flex-direction:column;min-width:240px;min-height:130px}
.win.top{border-color:#000;box-shadow:4px 4px 0 #000}
.bar{flex:none;display:flex;align-items:center;gap:8px;height:28px;padding:0 8px 0 6px;background:#e4e4e4;border-bottom:1px solid #8a8a8a;cursor:move;user-select:none;-webkit-user-select:none;touch-action:none}
.win.top .bar{background:#fff;border-color:#000}
.bar .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#555}
.win.top .bar .t{font-weight:bold;color:#000}
.bar .z{color:#555;font-size:14px}
.body{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.grip{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 0 50%,#000 50% 57%,transparent 57% 70%,#000 70% 77%,transparent 77%)}
body.drag iframe{pointer-events:none}
body.drag{user-select:none;-webkit-user-select:none}
iframe{display:block;width:100%;border:0;background:#fff}
.shot{flex:none;width:168px;height:210px;border:1px solid #000;background:#f2f2f2;display:grid;grid-template-columns:repeat(28,6px);grid-auto-rows:6px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.shot div{background-size:6px 6px;pointer-events:none}
.about{padding:20px 24px;display:flex;flex-direction:column;gap:14px}
.about .top{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.about .txt{flex:1 1 240px;display:flex;flex-direction:column;gap:10px;min-width:0}
.about h2{margin:0;font:bold 26px/1.15 'Times New Roman',Times,serif}
.about p{margin:0;font-size:17px;line-height:1.45}
.about .links{display:flex;flex-wrap:wrap;gap:6px 18px}
.essay{padding:4px 26px 26px}
.essay h2{margin:18px 0 2px;font:bold 26px/1.15 'Times New Roman',Times,serif}
.essay p{margin:14px 0 0;font-size:17px;line-height:1.45}
.lhead{flex:none;padding:12px 16px 10px;display:flex;flex-direction:column;gap:4px;border-bottom:1px solid #ccc}
.lhead b{font-size:18px;line-height:1.3;text-wrap:pretty}
.lhead .sub{font-style:italic;color:#444}
.lhead p{margin:4px 0 0;font-size:16px;line-height:1.4}
.lhead .meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:4px;font-size:14px}
.lhead .meta a:first-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lhead .arch{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:6px;font-size:14px}
.lhead .arch span{color:#444}
.note{flex:none;padding:4px 20px 5px 10px;font-size:13px;color:#555;border-top:1px solid #000}
.win .txtbody{padding:12px 14px}
/* mobile */
body.m #list{padding:30px 16px 32px;max-width:none}
body.m h1{margin:14px 0;font-size:28px;line-height:1.15;overflow-wrap:anywhere}
body.m{font-size:17px;line-height:1.35}
.mrow{display:grid;grid-template-columns:20px minmax(0,1fr) auto;column-gap:12px;align-items:start;min-height:48px;padding:8px 0;color:#000;text-decoration:none}
.mrow .nm{text-decoration:underline;overflow-wrap:anywhere;color:#0000EE}
.mrow.v .nm{color:#551A8B}
.mrow .d{font-size:15px;line-height:1.3;color:#333;display:block;margin-top:2px}
.mrow .dt{font-size:14px;color:#444;text-align:right;line-height:22px}
.mgrp{display:flex;align-items:baseline;gap:10px;padding:18px 0 4px;border-bottom:1px solid #ddd}
.mbar{position:sticky;top:0;z-index:1;background:#fff;border-bottom:1px solid #000;display:flex;align-items:center;gap:12px;padding:0 16px}
.mbar a{flex:none;display:flex;align-items:center;gap:8px;min-height:48px}
.mbar span{margin-left:auto;min-width:0;font-size:14px;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:right}
body.m .txtbody{padding:16px}
body.m .about{padding:20px 16px 8px}
body.m .about h2{font-size:28px}
body.m .about p,body.m .essay p{font-size:18px}
body.m .about .links{flex-direction:column;gap:0}
body.m .about .links a{min-height:44px;display:flex;align-items:center}
body.m .essay{padding:6px 16px 8px}
body.m .lhead{padding:16px 16px 12px;gap:6px;border-bottom:0}
body.m .lhead b{font-size:21px}
body.m .lhead p{font-size:18px;line-height:1.45}
body.m .lhead .meta,body.m .lhead .arch{font-size:16px;min-height:44px;align-items:center}
body.m .lhead .meta a:first-child{white-space:normal;overflow-wrap:anywhere}
body.m iframe{height:70vh;border-top:1px solid #000;border-bottom:1px solid #000}
body.m .note{border:0;padding:6px 16px 0;font-size:14px}
.foot{margin:20px 16px 32px;padding-top:8px;border-top:1px solid #8a8a8a;font-size:14px;color:#555}
</style>
</head>
<body>
<div id="list"><h1>Index of /</h1></div>
<noscript><p style="padding:0 16px">This directory listing needs JavaScript. Email: max@jaar.anonaddy.com</p></noscript>
<script>
(() => {
const MOBILE = matchMedia('(max-width: 760px)');
const ICON = { dir: 'folder', html: 'layout', txt: 'text', url: 'link' };
const $ = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const k in attrs || {}) { const v = attrs[k]; if (v == null || v === false) continue;
    if (k === 'style') e.style.cssText = v; else if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v); }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : String(c));
  return e;
};
const icon = name => $('img', { class: 'i', alt: '', src: 'icons/' + (name.endsWith('/') ? 'folder' : (ICON[name.split('.').pop().toLowerCase()] || 'text')) + '.png' });
const seen = new Set(JSON.parse(sessionStorage.getItem('seen') || '[]'));
const markSeen = p => { seen.add(p); sessionStorage.setItem('seen', JSON.stringify([...seen])); };
const toHash = p => '#' + encodeURI(p).replace(/#/g, '%23').replace(/\?/g, '%3F');
const fromHash = () => { try { return decodeURIComponent(location.hash.slice(1)) || '/'; } catch (e) { return '/'; } };
const parent = p => p.replace(/[^/]+\/?$/, '') || '/';

// ---------- content ----------
function parseMd(src) {
  src = (src || '').replace(/\r/g, '').replace(/<!--[\s\S]*?-->/g, '');
  const lines = src.split('\n'), meta = {}, entries = [], pre = [];
  const kv = (l, o) => { const m = l.match(/^([A-Za-z_]+):[ \t]?(.*)$/); if (!m) return false; o[m[1].toLowerCase()] = m[2].trim(); return true; };
  let i = 0;
  while (i < lines.length && !lines[i].trim()) i++;
  if ((lines[i] || '').trim() === '---') { i++; while (i < lines.length && lines[i].trim() !== '---') kv(lines[i++], meta); i++; }
  let group = null, cur = null, head = false;
  for (; i < lines.length; i++) {
    const l = lines[i];
    if (/^# /.test(l)) { group = l.slice(2).trim(); cur = null; continue; }
    if (/^## /.test(l)) { cur = { name: l.slice(3).trim(), group, meta: {}, body: [] }; entries.push(cur); head = true; continue; }
    if (cur && head) { if (!l.trim()) { head = false; continue; } if (kv(l, cur.meta)) continue; head = false; }
    (cur ? cur.body : pre).push(l);
  }
  const clean = a => a.join('\n').replace(/^\s*\n/, '').replace(/\s+$/, '');
  return { meta, body: clean(pre), entries: entries.map(e => ({ ...e, body: clean(e.body) })) };
}
async function load() {
  const get = async p => { try { const r = await fetch('content/' + p, { cache: 'no-cache' }); return r.ok ? await r.text() : ''; } catch (e) { return ''; } };
  const F = {}, D = { '/': [] };
  const bytes = s => new TextEncoder().encode(s || '').length;
  const kb = n => n < 1024 ? String(n) : (n / 1024).toFixed(1) + 'K';
  const paras = b => (b || '').split(/\n\s*\n/).map(s => s.replace(/\s*\n\s*/g, ' ').trim()).filter(Boolean);
  const segs = t => { const out = []; let last = 0; t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, a, b, o) => { if (o > last) out.push({ text: t.slice(last, o) }); out.push({ text: a, target: b }); last = o + m.length; return m; }); if (last < t.length) out.push({ text: t.slice(last) }); return out; };
  const wrapDoc = x => '<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;padding:12px;font-family:"Times New Roman",Times,serif}</style></head><body>' + x + '</body></html>';
  const cache = {}; const src = async p => (cache[p] = cache[p] || parseMd(await get(p)));
  const idx = await src('index.md');
  const build = async (dir, e) => {
    const name = e.name, path = dir + name;
    (D[dir] = D[dir] || []).push(name);
    if (name.endsWith('/')) {
      D[path] = D[path] || [];
      const sub = e.meta.source ? await src(e.meta.source) : { meta: {}, entries: [] };
      for (const c of sub.entries) await build(path, c);
      const dates = D[path].map(n => F[path + n].mod).filter(d => d && d !== '-').sort();
      F[path] = { name, path, kind: 'dir', group: e.group, mod: e.meta.date || dates[dates.length - 1] || '-', size: '-', desc: e.meta.description || sub.meta.description || '' };
      return;
    }
    let body = e.body, m = { ...e.meta };
    if (m.source) { const s = await src(m.source); body = s.body; m = { ...s.meta, ...m }; }
    const ext = (name.split('.').pop() || '').toLowerCase();
    const f = { name, path, group: e.group, mod: m.date || '-', desc: m.description || '' };
    if (ext === 'url') {
      const by = m.with ? 'with ' + m.with : '';
      Object.assign(f, { kind: 'link', title: m.title || name.replace(/\.url$/i, ''), href: m.url || '', archive: m.archive || '', blurb: paras(body).join(' '), role: m.role || '', gh: m.github || '',
        sub: [[m.outlet, (m.date || '').slice(0, 4)].filter(Boolean).join(', '), by].filter(Boolean).join(' · '),
        embedHtml: m.embed ? wrapDoc(m.embed) : '', size: String(bytes('[InternetShortcut]\r\nURL=' + (m.url || '') + '\r\n')) });
      if (!f.desc) f.desc = [m.outlet, by].filter(Boolean).join(' · ');
    } else if (ext === 'html' && m.type === 'about') {
      Object.assign(f, { kind: 'about', aboutName: m.name || '', paras: paras(body).map(segs), links: (m.links || '').split(',').map(s => s.trim()).filter(Boolean), size: kb(bytes(body) + 600) });
    } else if (ext === 'html') {
      Object.assign(f, { kind: 'essay', title: m.title || name.replace(/\.html$/i, ''), paras: paras(body), size: kb(bytes(body) + 600) });
    } else Object.assign(f, { kind: 'text', text: body, size: kb(bytes(body)) });
    F[path] = f;
  };
  for (const e of idx.entries) await build('/', e);
  return { F, D, site: idx.meta };
}

// ---------- headshot ----------
let keyP;
function headshot() {
  const el = $('div', { class: 'shot', oncontextmenu: e => e.preventDefault(), ondragstart: e => e.preventDefault() });
  keyP = keyP || fetch('headshot/key.json').then(r => r.json()).catch(() => ({ k: [] }));
  keyP.then(key => { for (const n of key.k) el.append($('div', { style: `background-image:url(headshot/t/${n}.png)` })); });
  return el;
}

// ---------- archive ----------
const archCache = {};
function archLine(f) {
  const slot = $('span', { style: 'font-style:italic;color:#555' }, 'checking archives…');
  const line = $('div', { class: 'arch' }, $('span', null, 'Archived copy:'), slot);
  const show = href => {
    const ts = (href.match(/\/web\/(\d{8})/) || [])[1];
    const label = ts ? `web.archive.org, ${ts.slice(0, 4)}-${ts.slice(4, 6)}-${ts.slice(6, 8)}` : /archive\.(ph|is|today)/.test(href) ? 'archive.ph, latest capture' : href.replace(/^https?:\/\/(www\.)?/, '').split('/')[0];
    slot.replaceWith($('a', { href, target: '_blank', rel: 'noopener' }, label));
  };
  if (f.archive) show(f.archive);
  else {
    archCache[f.href] = archCache[f.href] || fetch('https://archive.org/wayback/available?url=' + encodeURIComponent(f.href)).then(r => r.json())
      .then(j => { const s = j.archived_snapshots && j.archived_snapshots.closest; return s && s.available ? s.url.replace(/^http:/, 'https:') : ''; }).catch(() => '')
      .then(u => u || 'https://archive.ph/newest/' + f.href);
    archCache[f.href].then(show);
  }
  return line;
}

// ---------- file views ----------
const host = u => u.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');
function view(f, ctx) {
  if (f.kind === 'text') return $('div', { class: 'txtbody' }, $('pre', null, f.text));
  if (f.kind === 'essay') return $('div', { class: 'essay' }, $('h2', null, f.title), f.paras.map(p => $('p', null, p)));
  if (f.kind === 'about') {
    const para = segs => $('p', null, segs.map(s => !s.target ? s.text : s.target.startsWith('/') ? pathLink(s.text, s.target) : $('a', { href: s.target, target: '_blank', rel: 'noopener' }, s.text)));
    const top = ctx.mobile ? f.paras : f.paras.slice(0, 2), rest = ctx.mobile ? [] : f.paras.slice(2);
    return $('div', { class: 'about' },
      $('div', { class: 'top' }, headshot(), $('div', { class: 'txt' }, $('h2', null, f.aboutName), top.map(para))),
      rest.map(para),
      $('div', { class: 'links' }, f.links.map(l => pathLink(l.replace(/^\//, ''), l))));
  }
  if (f.kind === 'link') {
    const frag = document.createDocumentFragment();
    const toggle = ctx.mobile ? null : $('a', { href: '#', style: 'flex:none', onclick: e => { e.preventDefault(); ctx.toggleEmbed(); } }, ctx.embed ? 'hide page' : 'show page');
    frag.append($('div', { class: 'lhead' },
      $('b', null, f.title), $('span', { class: 'sub' }, f.sub),
      f.blurb && $('p', null, f.blurb),
      f.role && $('p', null, $('i', null, 'My part:'), ' ' + f.role),
      f.gh && $('a', { href: f.gh, target: '_blank', rel: 'noopener', style: 'font-size:14px' }, '[GitHub] ' + f.gh.replace(/^https?:\/\//, '')),
      $('div', { class: 'meta' }, $('a', { href: f.href, target: '_blank', rel: 'noopener' }, host(f.href)), toggle),
      archLine(f)));
    if (ctx.embed) {
      if (f.embedHtml) frag.append($('iframe', { srcdoc: f.embedHtml, title: f.title, sandbox: 'allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox', style: ctx.mobile ? '' : 'flex:1;min-height:0' }));
      else frag.append($('iframe', { src: f.href, title: f.title, referrerpolicy: 'no-referrer', loading: 'lazy', style: ctx.mobile ? '' : 'flex:1;min-height:0' }),
        $('div', { class: 'note' }, 'Blank? Some sites refuse to be embedded. Use the links above.'));
    }
    return frag;
  }
  return $('div', { class: 'txtbody' }, 'Unknown file type.');
}

// ---------- navigation ----------
let FS, internalNav = false, sort = null;
function pathLink(text, path) {
  return $('a', { href: toHash(path), class: seen.has(path) ? 'v' : null, onclick: e => { e.preventDefault(); go(path); } }, text);
}
function go(path) {
  markSeen(path);
  if (!path.endsWith('/') && !MOBILE.matches) { openWin(path); renderList(fromHash().endsWith('/') ? fromHash() : '/'); return; }
  internalNav = true;
  location.hash = toHash(path).slice(1);
}
function rows(dir) {
  const names = FS.D[dir] || [], items = names.map(n => FS.F[dir + n]).filter(Boolean);
  if (sort) {
    const key = { n: f => f.name.toLowerCase(), m: f => f.mod, s: f => f.size === '-' ? -1 : parseFloat(f.size) * (/K$/.test(f.size) ? 1024 : /M$/.test(f.size) ? 1048576 : 1), d: f => f.desc.toLowerCase() }[sort.k];
    return items.slice().sort((a, b) => (key(a) > key(b) ? 1 : key(a) < key(b) ? -1 : 0) * (sort.desc ? -1 : 1)).map(f => ({ f }));
  }
  const out = []; let last = null;
  items.forEach(f => { if (f.group && f.group !== last) { last = f.group; const c = items.filter(x => x.group === f.group).length; out.push({ group: f.group, count: c + (c === 1 ? ' file' : ' files') }); } out.push({ f }); });
  return out;
}
const heading = dir => 'Index of ' + (dir === '/' ? '/ ' + (FS.site.title || '') + ' /' : dir);
function renderList(dir) {
  const list = document.getElementById('list');
  document.title = '/' + (FS.site.title || '') + dir;
  //document.title = 'Index of ' + dir;
  const mobile = MOBILE.matches;
  const out = [$('h1', null, heading(dir))];
  if (mobile) {
    out.push($('hr', { style: 'margin:0 0 4px' }));
    if (dir !== '/') out.push($('a', { class: 'mrow', href: toHash(parent(dir)), style: 'align-items:center', onclick: e => { e.preventDefault(); go(parent(dir)); } }, $('img', { class: 'i', alt: '', src: 'icons/back.png' }), $('span', { class: 'nm' }, 'Parent Directory'), ''));
    for (const r of rows(dir)) {
      if (r.group) { out.push($('div', { class: 'mgrp' }, $('b', null, r.group), $('span', null, r.count))); continue; }
      const f = r.f, p = dir + f.name;
      out.push($('a', { class: 'mrow' + (seen.has(p) ? ' v' : ''), href: toHash(p), onclick: e => { e.preventDefault(); go(p); } },
        icon(f.name), $('span', { style: 'min-width:0' }, $('span', { class: 'nm' }, f.name), $('span', { class: 'd' }, f.desc)), $('span', { class: 'dt' }, f.mod)));
    }
  } else {
    const hdr = (k, label, style) => $('a', { href: '#', style, onclick: e => { e.preventDefault(); sort = sort && sort.k === k ? (sort.desc ? null : { k, desc: true }) : { k, desc: false }; renderList(dir); } }, label);
    out.push($('div', { class: 'row' }, $('span'), hdr('n', 'Name'), hdr('m', 'Last modified'), hdr('s', 'Size', 'text-align:right'), hdr('d', 'Description')), $('hr'));
    if (dir !== '/') out.push($('div', { class: 'row' }, $('img', { class: 'i', alt: '[PARENTDIR]', src: 'icons/back.png' }), pathLink('Parent Directory', parent(dir)), $('span'), $('span', { class: 's' }, '-'), $('span')));
    for (const r of rows(dir)) {
      if (r.group) { out.push($('div', { class: 'grp' }, $('b', null, r.group), $('span', null, r.count))); continue; }
      const f = r.f;
      const a = pathLink(f.name, dir + f.name); a.classList.add('n');
      out.push($('div', { class: 'row' }, icon(f.name), a, $('span', null, f.mod), $('span', { class: 's' }, f.size), $('span', null, f.desc)));
    }
  }
  out.push($('hr', mobile ? { style: 'margin:4px 0 8px' } : null), $('address', mobile ? { style: 'font-size:15px' } : null, FS.site.server || ''));
  list.replaceChildren(...out);
  list.style.display = '';
}
function renderPage(path) {
  const f = FS.F[path], list = document.getElementById('list');
  if (!f) { renderList('/'); return; }
  document.title = '/' + (FS.site.title || '') + path;
  //document.title = f.name;
  const back = $('a', { href: '#', onclick: e => { e.preventDefault(); if (internalNav && history.length > 1) history.back(); else go(parent(path)); } }, $('img', { class: 'i', alt: '', src: 'icons/back.png' }), 'Previous');
  list.style.display = 'none';
  let page = document.getElementById('page');
  if (!page) { page = $('div', { id: 'page' }); document.body.append(page); }
  page.replaceChildren($('div', { class: 'mbar' }, back, $('span', null, path)), view(f, { mobile: true, embed: true }), $('div', { class: 'foot' }, `Last modified ${f.mod} · ${f.size}`));
}
function route() {
  const path = fromHash(), mobile = MOBILE.matches;
  document.body.classList.toggle('m', mobile);
  const page = document.getElementById('page');
  if (mobile && !path.endsWith('/') && FS.F[path]) { markSeen(path); renderPage(path); window.scrollTo(0, 0); return; }
  if (page) page.remove();
  if (!path.endsWith('/')) { if (FS.F[path] && !mobile) { history.replaceState(null, '', toHash(parent(path))); openWin(path); } renderList(parent(path)); return; }
  renderList(FS.D[path] ? path : '/');
  if (mobile) window.scrollTo(0, 0);
}

// ---------- windows (desktop) ----------
const wins = new Map(); let zTop = 10, seq = 0;
const SIZES = { text: [460, 340], essay: [500, 560], about: [500, 520], link: [520, 740] };
function raise(w) { w.style.zIndex = ++zTop; for (const o of wins.values()) o.classList.toggle('top', o === w); }
function topWin() { let t = null; for (const w of wins.values()) if (!t || +w.style.zIndex > +t.style.zIndex) t = w; return t; }
function closeWin(path) { const w = wins.get(path); if (!w) return; w.remove(); wins.delete(path); const t = topWin(); if (t) raise(t); }
function openWin(path) {
  if (MOBILE.matches) return;
  const f = FS.F[path]; if (!f || f.kind === 'dir') return;
  markSeen(path);
  if (wins.has(path)) { raise(wins.get(path)); return; }
  let [w, h] = SIZES[f.kind] || [460, 340];
  w = Math.min(w, innerWidth - 32); h = Math.min(h, innerHeight - 32);
  const n = seq++ % 7;
  const x = Math.max(16, Math.min(Math.min(900, innerWidth - w - 16) + n * 28, innerWidth - w - 16)), y = Math.max(8, Math.min(36 + n * 28, innerHeight - h - 16));
  let embed = true;
  const body = $('div', { class: 'body' });
  const fill = () => body.replaceChildren(view(f, { mobile: false, embed, toggleEmbed: () => { embed = !embed; if (embed) el.style.height = Math.min(Math.max(el.offsetHeight, 740), innerHeight - 16) + 'px'; else el.style.height = '340px'; fill(); } }));
  const bar = $('div', { class: 'bar' }, icon(f.name), $('span', { class: 't' }, path), $('span', { class: 'z' }, f.size === '-' ? '' : f.size),
    $('a', { href: '#', style: 'font-size:15px', onpointerdown: e => e.stopPropagation(), onclick: e => { e.preventDefault(); closeWin(path); } }, 'close'));
  const grip = $('div', { class: 'grip' });
  const el = $('div', { class: 'win', style: `left:${x}px;top:${y}px;width:${w}px;height:${h}px`, onpointerdown: () => raise(el) }, bar, body, grip);
  const drag = (handle, mode) => handle.addEventListener('pointerdown', e => {
    if (e.button) return; e.preventDefault(); raise(el);
    const sx = e.clientX, sy = e.clientY, ox = mode ? el.offsetLeft : el.offsetWidth, oy = mode ? el.offsetTop : el.offsetHeight;
    handle.setPointerCapture(e.pointerId); document.body.classList.add('drag');
    const mv = ev => { const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (mode) { el.style.left = Math.max(80 - el.offsetWidth, Math.min(innerWidth - 80, ox + dx)) + 'px'; el.style.top = Math.max(0, Math.min(innerHeight - 28, oy + dy)) + 'px'; }
      else { el.style.width = Math.max(240, ox + dx) + 'px'; el.style.height = Math.max(130, oy + dy) + 'px'; } };
    const up = () => { handle.removeEventListener('pointermove', mv); handle.removeEventListener('pointerup', up); handle.removeEventListener('pointercancel', up); document.body.classList.remove('drag'); };
    handle.addEventListener('pointermove', mv); handle.addEventListener('pointerup', up); handle.addEventListener('pointercancel', up);
  });
  drag(bar, true); drag(grip, false);
  fill();
  document.body.append(el); wins.set(path, el); raise(el);
}
addEventListener('keydown', e => { if (e.key === 'Escape') { const t = topWin(); if (t) for (const [p, w] of wins) if (w === t) closeWin(p); } });

// ---------- boot ----------
load().then(fs => {
  FS = fs;
  const start = fromHash();
  route();
  if (!MOBILE.matches && start === '/' && FS.F['/about.html']) openWin('/about.html');
  addEventListener('hashchange', route);
  MOBILE.addEventListener('change', () => { if (MOBILE.matches) { for (const p of [...wins.keys()]) closeWin(p); } route(); });
});
})();
</script>
